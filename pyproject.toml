[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
pretty = true
exclude = ["^migrations/"]

# Heavy ML libraries ship large, fast-moving type surfaces that are not part
# of AMIP's static-analysis contract. Their adapters are type-checked here;
# third-party internals are deliberately skipped so Python 3.11 and 3.12
# environments produce the same project-level mypy result.
[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "torch",
    "torch.*",
    "pyannote",
    "pyannote.*",
]
follow_imports = "skip"
