services:
  migrate:
    build:
      context: .
      target: web
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      STORAGE_PATH: /data/storage
      LOG_FILE: /data/logs/app.log
    volumes:
      - amip_data:/data
    restart: "no"

  web:
    build:
      context: .
      target: web
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: sqlite:////data/app.db
      STORAGE_PATH: /data/storage
      LOG_FILE: /data/logs/app.log
    ports:
      - "8000:8000"
    volumes:
      - amip_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      STORAGE_PATH: /data/storage
      LOG_FILE: /data/logs/app.log
      HF_HOME: /models/huggingface
    volumes:
      - amip_data:/data
      - model_cache:/models
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  amip_data:
  model_cache:
