<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ meeting.title }} | AMIP</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/css/main.css"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="/meetings">← AMIP</a><span class="navbar-text">Transcrição</span></div></nav>
<main class="container py-4" data-meeting-id="{{ meeting.id }}">
<div class="d-flex flex-wrap justify-content-between gap-3 mb-4"><div><h1 class="h2 mb-1">{{ meeting.title }}</h1><p class="text-secondary mb-0">{{ meeting.description or 'Sem descrição.' }}</p></div><span id="meetingStatus" class="badge text-bg-secondary align-self-center fs-6">{{ meeting.status }}</span></div>
<div id="notice"></div>
<div class="row g-4"><div class="col-lg-5">
<div class="card shadow-sm mb-3"><div class="card-body"><h2 class="h5">1. Áudio</h2><p id="audioInfo" class="text-secondary">Verificando áudio...</p><form id="audioForm"><input id="audioFile" class="form-control mb-3" type="file" accept="audio/*" required><button class="btn btn-primary w-100" type="submit">Enviar áudio</button></form></div></div>
<div class="card shadow-sm"><div class="card-body"><h2 class="h5">2. Processamento</h2><button id="transcribeBtn" class="btn btn-success w-100 mb-3" disabled>Iniciar transcrição</button><div id="jobArea" class="small text-secondary">Nenhum job ativo.</div></div></div>
</div><div class="col-lg-7"><div class="card shadow-sm h-100"><div class="card-body"><div class="d-flex justify-content-between"><h2 class="h5">3. Transcrição</h2><button id="refreshBtn" class="btn btn-sm btn-outline-secondary">Atualizar</button></div><div id="transcript" class="mt-3 text-secondary">A transcrição aparecerá aqui quando estiver pronta.</div></div></div></div></div>
</main>
<script>
const meetingId = Number(document.querySelector('main').dataset.meetingId); const notice=document.getElementById('notice'); const btn=document.getElementById('transcribeBtn'); let pollTimer=null;
function errorMessage(data,fallback){return data && data.detail ? (typeof data.detail==='string'?data.detail:JSON.stringify(data.detail)) : fallback;}
async function loadAudio(){const r=await fetch(`/api/meetings/${meetingId}/audio`); if(r.ok){const a=await r.json(); document.getElementById('audioInfo').textContent=`${a.filename} • ${(a.file_size/1024/1024).toFixed(2)} MB`; document.getElementById('audioForm').classList.add('d-none'); btn.disabled=false; return true;} document.getElementById('audioInfo').textContent='Nenhum áudio enviado.'; return false;}
async function loadTranscript(){const r=await fetch(`/api/meetings/${meetingId}/transcription`); if(!r.ok)return false; const t=await r.json(); document.getElementById('meetingStatus').textContent='TRANSCRIBED'; const segments=(t.segments||[]).map(s=>`<div class="border-start border-3 ps-3 mb-3"><small class="text-muted">${Number(s.start_time).toFixed(1)}s – ${Number(s.end_time).toFixed(1)}s</small><div>${escapeHtml(s.text)}</div></div>`).join(''); document.getElementById('transcript').innerHTML=`<p class="fw-semibold">Idioma: ${escapeHtml(t.language || 'auto')}</p><p>${escapeHtml(t.text)}</p>${segments}`; btn.disabled=true; return true;}
async function loadJobs(){const r=await fetch(`/api/meetings/${meetingId}/jobs`); if(!r.ok)return; const data=await r.json(); const job=(data.jobs||[]).find(j=>j.job_type==='TRANSCRIBE'); if(!job)return; renderJob(job); if(['PENDING','RUNNING','RETRYING'].includes(job.status))startPolling(job.id);}
function renderJob(j){document.getElementById('jobArea').innerHTML=`<div class="d-flex justify-content-between"><span>${j.status}</span><strong>${j.progress || 0}%</strong></div><div class="progress mt-2"><div class="progress-bar" style="width:${j.progress || 0}%"></div></div>${j.error_message?`<div class="text-danger mt-2">${escapeHtml(j.error_message)}</div>`:''}`;}
function startPolling(jobId){if(pollTimer)return; pollTimer=setInterval(async()=>{const r=await fetch(`/api/jobs/${jobId}`); if(!r.ok)return; const j=await r.json(); renderJob(j); if(['COMPLETED','FAILED','CANCELLED'].includes(j.status)){clearInterval(pollTimer);pollTimer=null;await loadTranscript();}},1500);}
function escapeHtml(value){const d=document.createElement('div');d.textContent=value??'';return d.innerHTML;}
document.getElementById('audioForm').addEventListener('submit',async e=>{e.preventDefault(); const fd=new FormData();fd.append('file',document.getElementById('audioFile').files[0]); const r=await fetch(`/api/meetings/${meetingId}/audio`,{method:'POST',body:fd});const data=await r.json();if(!r.ok){notice.innerHTML=`<div class="alert alert-danger">${escapeHtml(errorMessage(data,'Falha no upload.'))}</div>`;return;} notice.innerHTML='<div class="alert alert-success">Áudio enviado.</div>';await loadAudio();});
btn.addEventListener('click',async()=>{btn.disabled=true;const r=await fetch(`/api/meetings/${meetingId}/jobs/transcription`,{method:'POST'});const data=await r.json();if(!r.ok){notice.innerHTML=`<div class="alert alert-danger">${escapeHtml(errorMessage(data,'Falha ao iniciar transcrição.'))}</div>`;btn.disabled=false;return;}renderJob(data);startPolling(data.id);});
document.getElementById('refreshBtn').addEventListener('click',loadTranscript);
(async()=>{await loadAudio();if(!(await loadTranscript()))await loadJobs();})();
</script></body></html>
