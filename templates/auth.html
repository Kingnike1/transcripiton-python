<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acesso | AMIP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width:720px">
  <div class="text-center mb-4"><h1 class="h2">AMIP</h1><p class="text-secondary">Acesso seguro ao workspace de reuniões.</p></div>
  <div id="notice"></div>
  <div class="row g-4">
    <div class="col-md-6">
      <div class="card shadow-sm h-100"><div class="card-body">
        <h2 class="h5">Entrar</h2>
        <form id="loginForm">
          <label class="form-label mt-2" for="loginEmail">E-mail</label><input id="loginEmail" class="form-control" type="email" required>
          <label class="form-label mt-3" for="loginPassword">Senha</label><input id="loginPassword" class="form-control" type="password" required>
          <button class="btn btn-primary w-100 mt-4" type="submit">Entrar</button>
        </form>
      </div></div>
    </div>
    <div class="col-md-6">
      <div class="card shadow-sm h-100"><div class="card-body">
        <h2 class="h5">{% if authentication_enabled %}Criar outra conta{% else %}Criar primeira conta{% endif %}</h2>
        {% if not authentication_enabled %}<p class="small text-secondary">A primeira conta assumirá as reuniões antigas que já existirem neste AMIP.</p>{% endif %}
        <form id="registerForm">
          <label class="form-label mt-2" for="registerEmail">E-mail</label><input id="registerEmail" class="form-control" type="email" required>
          <label class="form-label mt-3" for="registerPassword">Senha</label><input id="registerPassword" class="form-control" type="password" minlength="10" required>
          <button class="btn btn-success w-100 mt-4" type="submit">Criar conta</button>
        </form>
      </div></div>
    </div>
  </div>
</main>
<script>
const notice=document.getElementById('notice');
async function submitAuth(url,email,password){
  notice.innerHTML='';
  const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  let data={}; try{data=await response.json();}catch(_e){}
  if(!response.ok){notice.innerHTML=`<div class="alert alert-danger">${data.detail || 'Não foi possível concluir o acesso.'}</div>`;return;}
  window.location.href='/meetings';
}
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();submitAuth('/api/auth/login',document.getElementById('loginEmail').value,document.getElementById('loginPassword').value);});
document.getElementById('registerForm').addEventListener('submit',e=>{e.preventDefault();submitAuth('/api/auth/register',document.getElementById('registerEmail').value,document.getElementById('registerPassword').value);});
</script>
</body></html>
